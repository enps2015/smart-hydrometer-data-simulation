name: Validação do Smart Hydrometer

on:
  push:
    branches: [main]
    paths:
      - "validate_data.py"
      - "tests/**"
      - "requirements.txt"
      - "datasets_versao_1/**"
      - "datasets_hidrometros_v2/separados_mensais_csv_gz/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "validate_data.py"
      - "tests/**"
      - "requirements.txt"
      - "datasets_versao_1/**"
      - "datasets_hidrometros_v2/separados_mensais_csv_gz/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-hydrometer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes e perfil de amostra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mínimo (evita baixar todos os datasets grandes)
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /validate_data.py
            /requirements.txt
            /tests/**
            /datasets_versao_1/simulacao_hidrometros_por_mes_cidade/csv/curitiba/hidrometros_curitiba_january.csv

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m compileall -q validate_data.py tests

      - name: Executar testes automatizados
        run: python -m pytest -q

      - name: Validar amostra real do dataset v1
        run: python validate_data.py --file "datasets_versao_1/simulacao_hidrometros_por_mes_cidade/csv/curitiba/hidrometros_curitiba_january.csv" --sample-rows 100 --preview-rows 0
