name: Validação do Smart Hydrometer

on:
  push:
    branches: [main]
    paths:
      - "validate_data.py"
      - "tests/**"
      - "requirements.txt"
      - "samples/**"
      - "README.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "validate_data.py"
      - "tests/**"
      - "requirements.txt"
      - "samples/**"
      - "README.md"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-hydrometer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes e perfil de amostra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mínimo
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /validate_data.py
            /requirements.txt
            /tests/**
            /samples/v1_sample.csv

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m compileall -q validate_data.py tests

      - name: Executar testes automatizados
        run: python -m pytest -q

      - name: Validar amostra sintética de demonstração
        run: python validate_data.py --file "samples/v1_sample.csv" --sample-rows 100 --preview-rows 0
